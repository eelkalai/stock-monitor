<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Stock Monitor</a>
    <a class="notif-link" href="{{ url_for('notifications') }}">
      Alerts
      {% if unread_count %}<span class="badge">{{ unread_count }}</span>{% endif %}
    </a>
    <form action="{{ url_for('toggle_polling') }}" method="post" class="polling-toggle">
      <button type="submit" class="switch {{ 'on' if polling_enabled else 'off' }}">
        Live updates: {{ 'On' if polling_enabled else 'Off' }}
      </button>
    </form>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
